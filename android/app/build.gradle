apply plugin: 'com.android.application'

/**
 * Release signing.
 *
 * Create android/keystore.properties (gitignored) next to this file:
 *
 *   storeFile=../rxd-release.jks
 *   storePassword=...
 *   keyAlias=rxd
 *   keyPassword=...
 *
 * With no keystore present, `assembleRelease` still runs R8/minification and
 * produces app-release-unsigned.apk — useful for verifying the release build
 * without shipping anything signed by a debug key (HIGH-2).
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "org.radiant.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.radiant.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Single source of truth for the version: package.json.
        // versionCode is derived from the semver so it always increases:
        //   1.2.3 -> 10203
        // Bump with `npm version patch|minor|major` and rebuild.
        def pkg = new groovy.json.JsonSlurper().parseText(rootProject.file('../package.json').text)
        def versionParts = pkg.version.tokenize('.').collect { it as int }
        versionName pkg.version
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
            // HIGH-2: sign with apex (v2), v3 (key rotation) and v4 alongside v1
            // so verifiers on every Android version can validate the artifact.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    buildTypes {
        debug {
            // The debug keystore is public; never treat a debug build as
            // identity. WebView debugging is disabled at runtime in
            // MainActivity + capacitor.config.ts regardless.
            debuggable true
        }
        release {
            debuggable false
            jniDebuggable false
            // Shrink + obfuscate: smaller artifact and less build metadata
            // (finding L3) left in the shipped bytecode.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // BiometricPrompt + CryptoObject for hardware-backed wallet unlock.
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
