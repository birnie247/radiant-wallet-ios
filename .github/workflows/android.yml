name: Build Android APK

# Builds a debug APK in the cloud so the APK can be produced without installing
# Android Studio / the Android SDK locally (this repo was developed without one).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 8 / AGP 8.7+ need a modern JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # No android-actions/setup-android step here on purpose: that action is
      # unmaintained and now runs forced onto Node 24, where it fails. The
      # ubuntu-latest image already ships an Android SDK with accepted licences,
      # and AGP downloads any missing platform/build-tools itself
      # (android.builder.sdkDownload defaults to true).
      - name: Check Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK at: $SDK"
          ls "$SDK" || true
          # Best effort: pre-install the platform so the Gradle step cannot time
          # out on a download. A miss here is not fatal — AGP will fetch it.
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" >/dev/null || true
          fi
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build web assets
        run: npm run build

      - name: Verify the browser crypto path
        run: npm run check:browser

      # Loads the real built bundle in headless Chrome. This is the only gate
      # that can catch WebView-only failures (e.g. a missing `Buffer` global,
      # which Node has and a browser does not).
      - name: Browser smoke test
        run: npm run check:smoke

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rxd-wallet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
